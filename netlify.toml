[build]
  base = "frontend"
  command = "node ../scripts/netlify-proxy.mjs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# Recommended: API_PROXY_ORIGIN=https://your-api.example.org, leave
# VITE_API_BASE_URL unset. /api is proxied before the SPA fallback so the
# session cookie is first-party. PUBLIC_ORIGIN on the API is the frontend origin.
