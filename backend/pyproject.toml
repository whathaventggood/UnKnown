[project]
name = "unknown-explorer"
version = "0.1.0"
description = "An evidence-aware AI knowledge exploration system"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.121,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0.38,<3", "alembic>=1.14,<2", "httpx>=0.28,<1"]
[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.uv]
package = false
